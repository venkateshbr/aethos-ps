name: Supply-chain security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Fail on high or critical npm advisories
        working-directory: frontend
        run: npm audit --audit-level=high

  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Audit the backend lockfile dependency set
        working-directory: backend
        run: |
          set -euo pipefail
          test -f uv.lock # backend/uv.lock is the reviewed dependency source
          uv export --locked --format requirements-txt --no-hashes --no-emit-project --output-file /tmp/aethos-backend-requirements.txt
          uvx pip-audit --strict -r /tmp/aethos-backend-requirements.txt
