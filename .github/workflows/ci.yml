name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Commitlint is intentionally installed ephemerally because this repository
  # has no root package.json. The config remains the single policy source.
  commitlint:
    name: Commit messages (commitlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Lint pushed or pull-request commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts @commitlint/cli@19 @commitlint/config-conventional@19
          if [ "$EVENT_NAME" = "push" ] && [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -1)"
          fi
          npx commitlint --config commitlint.config.js --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  agent-security:
    name: AgentShield configuration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan agent configuration and supply chain
        uses: affaan-m/agentshield@9bbc007cf5afb562c324bbad4ce6c544420f49f6 # v1.4.0
        with:
          path: "."
          min-severity: "high"
          fail-on-findings: "true"
          supply-chain: "true"
          fail-on-supply-chain: "true"

  # ── 1. Backend lint ────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Run ruff
        working-directory: backend
        run: uv run ruff check app/ tests/

  # ── 1b. Backend type check ─────────────────────────────────────────────────
  backend-typecheck:
    name: Backend type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Run mypy
        working-directory: backend
        run: uv run mypy app/ || echo "::warning::Type check warnings"

  # ── 1c. Backend dependency audit ──────────────────────────────────────────
  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: pip-audit
        working-directory: backend
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --output-file /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt || echo "::warning::Dependency vulnerabilities found"

  # ── 2. Backend tests ───────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (unit + property)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Run pytest (unit + property only — no DB required)
        working-directory: backend
        run: |
          uv run pytest tests/unit/ tests/property/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=79

      - name: Agent-eval offline gate (#407)
        working-directory: backend
        run: |
          uv run python -m scripts.agent_eval_gate --out "$GITHUB_STEP_SUMMARY"

  # ── 3. Frontend checks ─────────────────────────────────────────────────────
  # Angular lint is tracked separately because this workspace has no lint
  # target. Typecheck, unit, and Playwright discovery are mandatory meanwhile.
  frontend-check:
    name: Frontend typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend package.json exists
        id: check_pkg
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check_pkg.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Typecheck both applications and specs
        if: steps.check_pkg.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        if: steps.check_pkg.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test:ci

      - name: Validate Playwright discovery
        if: steps.check_pkg.outputs.exists == 'true'
        working-directory: frontend
        run: npx playwright test --list --reporter=line

  # ── 4. Frontend build ──────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend package.json exists
        id: check_pkg
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check_pkg.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build both applications (production)
        if: steps.check_pkg.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build:all

  # ── 5. Secret scan ────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
