name: Supply-chain IOC scan
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Supply-chain IOC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci --ignore-scripts 2>/dev/null || echo "No npm setup"
          fi

      - name: Check for known IOC patterns
        run: |
          echo "::group::IOC Scan"
          npm audit --audit-level=high 2>/dev/null || true
          find node_modules -name "postinstall.js" -o -name "preinstall.js" 2>/dev/null | while read f; do
            if grep -q "curl\|wget\|eval\|exec\|child_process" "$f" 2>/dev/null; then
              echo "::warning file=$f::Suspicious install script detected"
            fi
          done
          echo "::endgroup::"