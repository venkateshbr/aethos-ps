[Unit]
BindsTo=aethos-hermes-port-guard.service docker.service aethos-nous-hermes-firewall.service
After=aethos-hermes-port-guard.service docker.service aethos-nous-hermes-firewall.service

[Service]
# Replace the old broad-firewall precheck; retain the dedicated service's sandbox and UID.
ExecStartPre=
ExecStartPre=+/usr/bin/python3 -I -B /opt/aethos-hermes-runtime/hermes_listener_guard.py prepare
ExecStart=
ExecStart=/usr/bin/env API_SERVER_HOST=172.31.254.1 API_SERVER_PORT=8643 /opt/aethos-hermes-runtime/venv/bin/python /usr/local/lib/hermes-agent/venv/bin/hermes gateway run
# Only the unprivileged runtime may bind TCP 8643/IPv4; the guard checks its exact address and PID.
SocketBindDeny=any
SocketBindAllow=ipv4:tcp:8643
ExecStartPost=+/usr/bin/python3 -I -B /opt/aethos-hermes-runtime/hermes_listener_guard.py activate $MAINPID
ExecStopPost=+/usr/bin/python3 -I -B /opt/aethos-hermes-runtime/hermes_listener_guard.py close
TimeoutStartSec=105s
