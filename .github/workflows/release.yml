name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (for example v0.1.0-rc.1)"
        required: true
        default: "v0.1.0-dry-run.1"
      dry_run:
        description: "Validate only; do not build, deploy, or publish a release"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Aethos release readiness
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Manual release runs are validation-only. Push a reviewed tag on main to deploy."
            exit 1
          fi

      - name: Require a deployed tag to point at origin/main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "::error::Release tags must point at origin/main"
            exit 1
          }

      - name: Validate tag and Aethos version policy
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          }
          TAG_VERSION="${RELEASE_TAG#v}"
          TAG_CORE="${TAG_VERSION%%-*}"
          BACKEND_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")"
          BACKEND_CORE="${BACKEND_VERSION%-pre}"
          [ "$TAG_CORE" = "$BACKEND_CORE" ] || {
            echo "::error::Tag release line ($TAG_CORE) does not match backend release line ($BACKEND_CORE)"
            exit 1
          }
          if [[ "$BACKEND_VERSION" == *-pre && "$TAG_VERSION" != *-* ]]; then
            echo "::error::Stable tags are blocked while the backend version is marked -pre"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_TAG against backend version $BACKEND_VERSION"

      - name: Validate production image definitions
        run: |
          set -euo pipefail
          test -f backend/Dockerfile
          test -f frontend/Dockerfile.prod
          test -f frontend/Dockerfile.timesheet.prod
          test -f integrations/hermes/Dockerfile
          python scripts/deploy/gen-registry-compose.py
          git diff --exit-code docker-compose.hostinger.registry.yml

  deploy:
    name: Deploy through the established Hostinger workflow
    needs: verify
    if: needs.verify.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-hostinger.yml
    with:
      apply_migrations: ""
    secrets: inherit

  announce:
    name: Publish GitHub release
    needs: [verify, deploy]
    if: needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true
            })
